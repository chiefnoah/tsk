when:
  - event: ["push", "manual"]
    branch: ["master"]
  - event: ["push"]
    tag: ["v*"]
engine: "nixery"
dependencies:
  nixpkgs:
    - cargo
    - gcc
steps:
  - name: "Check"
    command: "cargo check"
  - name: "Build"
    command: "cargo build"
  - name: "cargo test"
    command: "cargo test"
  - name: "Publish"
    command: 'if [ "$TANGLED_REF_TYPE" = "tag" ]; then cargo publish; else echo "Skipping publish for non-tag ref"; fi'
