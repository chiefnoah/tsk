[package]
name = "tsk-cli"
version = "0.4.0"
edition = "2024"
publish = true
license-file = "LICENSE"
description = "A command-line first, file-system based task manager"
repository = "https://codeberg.org/ngp/tsk"
homepage = "https://tsk.ngp.computer/"
readme = "readme"
authors = ["Noah Pederson <noah@packetlost.dev>"]

[[bin]]
name = "tsk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
edit = "0"
thiserror = "2"
url = "2"
xattr = "1"
colored = "3"
open = "5"
itertools = "0"
git2 = { version = "0.20", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
clap_mangen = "0"
