[package]
name = "tsk-cli"
version = "1.0.2"
edition = "2024"
publish = true
license-file = "LICENSE"
description = "A command-line first, file-system based task manager"
repository = "https://codeberg.org/ngp/tsk"
homepage = "https://tsk.ngp.computer/"
readme = "readme"
authors = ["Noah Pederson <noah@packetlost.dev>"]

[lib]
name = "tsk_cli"
path = "src/lib.rs"

# Both bins are thin shims around `tsk_cli::run`. Cargo auto-discovers them
# from `src/bin/`, so no explicit [[bin]] entries are needed.

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
edit = "0"
thiserror = "2"
url = "2"
xattr = "1"
colored = "3"
itertools = "0"
git2 = { version = "0.21", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
clap_mangen = "0"
